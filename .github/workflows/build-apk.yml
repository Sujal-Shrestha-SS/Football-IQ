name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release (direct public download link)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://football-iq-kouo.onrender.com' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/football-iq.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-iq-apk
          path: release-output/football-iq.apk
          retention-days: 30

      - name: Publish GitHub Release (if tagged or manually requested)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/football-iq.apk
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Football IQ Build #{0}', github.run_number) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
